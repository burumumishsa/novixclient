<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novix Launcher – Stable & Dev</title>
    <style>
        /* ----- same banner aesthetic, minimal & clean ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, 'Segoe UI', 'Inter', sans-serif;
            background: #0b1120;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            background-image: radial-gradient(ellipse at 20% 50%, #1a2a3a 0%, transparent 70%);
        }

        .launcher-container {
            max-width: 1200px;
            width: 100%;
        }

        .launcher-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .launcher-header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #e2e8f0, #a5f3c3);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 0.25rem;
        }

        .launcher-header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        /* ----- section titles ----- */
        .section-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 2rem 0 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid rgba(72, 187, 120, 0.3);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title .badge {
            font-size: 0.8rem;
            background: #1e293b;
            padding: 0.1rem 0.8rem;
            border-radius: 20px;
            color: #94a3b8;
            font-weight: 500;
        }

        /* ----- version grid (cards) ----- */
        .versions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.2rem;
        }

        .version-card {
            background: linear-gradient(145deg, #1a2332, #0f172a);
            border-radius: 7px;
            padding: 1.2rem 1rem 1rem;
            border: 1px solid rgba(72, 187, 120, 0.2);
            box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }

        .version-card:hover {
            transform: translateY(-3px);
            border-color: rgba(72, 187, 120, 0.5);
        }

        .card-type {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 0.3rem;
        }

        .card-type.stable { color: #4ade80; }
        .card-type.dev   { color: #facc15; }

        .card-version {
            font-size: 1.4rem;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 0.3rem;
        }

        .card-description {
            font-size: 0.85rem;
            color: #cbd5e6;
            line-height: 1.4;
            flex: 1;
            margin: 0.2rem 0 0.8rem;
        }

        .card-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: auto;
        }

        .play-btn {
            background: linear-gradient(98deg, #2b9348, #1e7e34);
            padding: 0.4rem 1.2rem;
            border-radius: 7px;
            font-weight: 600;
            font-size: 0.85rem;
            color: white;
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .play-btn:hover {
            background: #3ba55c;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.3);
        }

        .launcher-footer {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 0.85rem;
            color: #64748b;
            border-top: 1px solid #1e293b;
            padding-top: 1.5rem;
        }

        @media (max-width: 640px) {
            .launcher-header h1 { font-size: 2rem; }
            .versions-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="launcher-container">

    <!-- ===== HEADER ===== -->
    <header class="launcher-header">
        <h1>⚡ Novix Launcher</h1>
        <p>Pick your build – Stable or Dev</p>
    </header>

    <!-- ===== VERSION CONTAINERS ===== -->
    <div id="stableContainer"></div>
    <div id="devContainer"></div>

    <!-- ===== FOOTER ===== -->
    <footer class="launcher-footer">
        <span>🚀 Actively developed · <a href="#" style="color:#94a3b8; text-decoration:underline;">Report issue</a></span>
    </footer>

</div>

<!-- ========================================================== -->
<!-- ==========  JAVASCRIPT CONFIGURATION  ==================== -->
<!-- ========================================================== -->
<script>
    (function() {
        // --------------------------------------------------------------
        //  📦  VERSIONS CONFIGURATION – edit this array freely
        // --------------------------------------------------------------
        const VERSIONS = [
            // ---------- STABLE BUILDS ----------
            {
                type: "stable",
                version: "26.1.2",
                description: "Latest stable release – multiplayer & skins"
            },
            {
                type: "stable",
                version: "26.1.1",
                description: "Previous stable with full compatibility"
            },
            {
                type: "stable",
                version: "26.0.9",
                description: "Legacy stable for older servers"
            },
            // ---------- DEV BUILDS ----------
            {
                type: "dev",
                version: "26.2.0-pre1",
                description: "Experimental features & performance tweaks"
            },
            {
                type: "dev",
                version: "26.2.0-pre2",
                description: "New rendering engine (testing)"
            }
        ];

        // --------------------------------------------------------------
        //  RENDER CARDS BY TYPE
        // --------------------------------------------------------------
        function renderSection(type, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;

            const filtered = VERSIONS.filter(v => v.type === type);
            if (filtered.length === 0) {
                container.innerHTML = `<p style="color:#94a3b8; padding:1rem 0;">No ${type} builds available.</p>`;
                return;
            }

            // Create grid wrapper
            const grid = document.createElement('div');
            grid.className = 'versions-grid';

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'version-card';

                // Build link: /versions/{type}/{version}.html
                const linkHref = `/versions/${item.type}/${item.version}.html`;

                // Card HTML
                card.innerHTML = `
                    <div class="card-type ${item.type}">${item.type}</div>
                    <div class="card-version">${escapeHtml(item.version)}</div>
                    <div class="card-description">${escapeHtml(item.description)}</div>
                    <div class="card-actions">
                        <a href="${escapeHtml(linkHref)}" class="play-btn" target="_blank" rel="noopener noreferrer">
                            ▶ Play version ${escapeHtml(item.version)}
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });

            // Insert the grid into the container
            container.appendChild(grid);
        }

        // Helper: escape HTML to prevent injection
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;');
            });
        }

        // --------------------------------------------------------------
        //  INIT – add section titles and render
        // --------------------------------------------------------------
        function renderAll() {
            // Create section titles dynamically
            const stableTitle = document.createElement('div');
            stableTitle.className = 'section-title';
            stableTitle.innerHTML = `🟢 Stable <span class="badge">recommended</span>`;
            document.getElementById('stableContainer').before(stableTitle);

            const devTitle = document.createElement('div');
            devTitle.className = 'section-title';
            devTitle.innerHTML = `🟡 Dev Build <span class="badge">experimental</span>`;
            document.getElementById('devContainer').before(devTitle);

            renderSection('stable', 'stableContainer');
            renderSection('dev', 'devContainer');
        }

        // Run when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', renderAll);
        } else {
            renderAll();
        }

        // Expose config for debugging (optional)
        window.__VERSIONS = VERSIONS;
    })();
</script>

</body>
</html>
